name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Node for extension tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned extension test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@main
        with:
          php-version: '8.5'
          test-command: php tests/run.php

  browser:
    name: Browser and tile acceptance (no capture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Node for browser tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check device data guidance and step 4 in browser and tile
        timeout-minutes: 5
        run: npm run test:browser
